# Build installer Windows (.exe NSIS + .msi) di GitHub tanpa perlu install Rust/VS di laptop.
# Cara pakai: push ke GitHub -> tab Actions -> "Build Windows" -> Run workflow -> unduh artifact "OmniWidget-windows".
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: OmniWidget-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
