[package]
name = "omniwidget"
version = "1.0.0"
edition = "2021"

[lib]
name = "omniwidget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-clipboard-manager = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "stream"] }
tokio-util = "0.7"
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
zip = "2.0"
tar = "0.4"
flate2 = "1.0"
xz2 = "0.1"
infer = "0.15"
image = { version = "0.25", features = ["jpeg", "png", "webp", "bmp", "ico", "gif"] }
pdfium-render = "0.8"

# Konverter tanpa biner eksternal (TDD 4.1): audio & dokumen murni Rust.
symphonia = { version = "0.5", features = ["mp3", "wav", "flac", "ogg", "vorbis", "aac", "isomp4"] }
hound = "3.5"
mp3lame-encoder = "0.3"
flacenc = "0.5"
vorbis_rs = "0.5"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
scraper = "0.29"
ego-tree = "0.11"
docx-rs = "0.4"
quick-xml = "0.37"
genpdf = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
getrandom = "0.2"
open = "5"
# Clipboard Manager: watcher lintas platform (TDD 4.5) & enkripsi riwayat persisten
clipboard-rs = "0.2"
chacha20poly1305 = "0.10"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rqrr = { version = "0.11.0", default-features = false }
sysinfo = "0.40.1"
xcap = "0.9.8"

# Kunci enkripsi disimpan di keychain OS. Tanpa fitur platform, keyring v3 memakai penyimpanan palsu.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation"] }
# Now-playing tanpa Premium: Windows SMTC (Windows.Media.Control) + Core Audio untuk volume.
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_WinRT",
] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
